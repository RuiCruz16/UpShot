name: Build unsigned IPA for AltStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS (native project)
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned .app
        run: |
          set +e
          xcodebuild \
            -workspace ios/UpShot.xcworkspace \
            -scheme UpShot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== ERROR LINES ==="
            grep -E "error:" build.log | head -50
            echo "=== LAST 80 LINES ==="
            tail -80 build.log
          fi
          exit $status

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UpShot.app Payload/
          zip -qr UpShot-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpShot-unsigned
          path: UpShot-unsigned.ipa